name: CI

# Vercel builds and deploys every push through its Git integration; this
# workflow only gates code quality.
on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match local dev: npm 10 (Node 22) rejects the npm 11 lockfile.
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
